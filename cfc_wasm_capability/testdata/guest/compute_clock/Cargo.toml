# Guest crate for the `compute_clock` fixture: a component importing exactly
# wasi:clocks/wall-clock. Built out-of-band with `cargo component build
# --release`; the result is checked into ../../compute_clock.wasm.
[package]
name = "cfc-compute-clock"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
wit-bindgen-rt = { version = "0.35", features = ["bitflags"] }

[lib]
crate-type = ["cdylib"]

[package.metadata.component]
package = "cfc:clocktest"

[package.metadata.component.target]
path = "wit"
world = "clock-world"

[package.metadata.component.target.dependencies]
"wasi:clocks" = { path = "wit/deps/clocks" }

[profile.release]
strip = true
lto = true
