syntax = "proto3";

// CFC-owned capability claim schema for confidential WebAssembly workloads.
//
// This schema is deliberately CFC-scoped, NOT part of Oak-proper: Oak stays
// policy-agnostic and carries the serialized claim as opaque bytes inside the
// `WasmWorkloadLayerData` DICE event. Only the relying party (the CFC KMS)
// decodes and evaluates it.
//
// Package name is kept as `fcp.confidentialcompute` so this proto can later be
// promoted verbatim to
// `federated-compute/fcp/protos/confidentialcompute/wasm_capability.proto`
// (Phase 1b/2) and shared by both the Oak orchestrator and the CFC KMS without
// a rename. For Phase 1a it lives inside the `cfc_wasm_capability` crate.
package fcp.confidentialcompute;

// The capability claim describing what a wasm workload composition can do.
//
// The claim travels inside the measured DICE event log; the layer certificate
// commits to the event digest, and the chain roots in the hardware report. It
// therefore carries no signature, nonce, session id, or timestamp of its own.
message WasmCapabilityClaim {
  // Schema identifier; an unknown value is rejected by the KMS.
  string schema_version = 1;  // "cfc-wasm-claim-v1"

  // Stable identifier for a private release. SHA-256 over the sorted component
  // (id, role, digest) triples || canonical graph || canonical granted-
  // capability set || runtime config. Computed from the exact in-memory bytes
  // the orchestrator instantiates. See overall plan sections 6 and 7.3.
  bytes application_commitment = 2;

  WasmRuntimeInfo runtime_info = 3;
  CompositionGraph graph = 4;
  repeated ComponentClaim components = 5;
  repeated GrantedWasiCapability granted_capabilities = 6;
  RuntimeProperties runtime_properties = 7;

  // The exact WASI grant the orchestrator's runtime enforces for this workload
  // (the declarative configuration behind the wasmtime `WasiCtx`). This is the
  // enforced *ceiling* of ambient authority, independent of what the components
  // import. `runtime_properties` above is a coarse projection of the
  // intersection of these grants with the imported interfaces. Absent when the
  // claim was derived without a runtime grant (e.g. pure static analysis).
  WasiRuntimeGrant wasi_runtime_grant = 8;
}

// The declarative WASI capability grant the runtime enforces: the attestable
// projection of the host's `WasiCtx` configuration (host-only details such as
// real filesystem paths and environment *values* are deliberately omitted).
message WasiRuntimeGrant {
  // Preopened directories handed to the guest. Empty => no filesystem reachable.
  repeated Preopen preopens = 1;
  // Whether network egress (wasi:sockets) is permitted. false => none reachable.
  bool network = 2;
  // Names (not values) of environment variables exposed. Empty => none.
  repeated string env_names = 3;
  // Command-line arguments exposed. Empty => none.
  repeated string args = 4;
  StdioGrant stdin = 5;
  StdioGrant stdout = 6;
  StdioGrant stderr = 7;
  bool wall_clock = 8;
  bool monotonic_clock = 9;
  RandomGrant random = 10;
}

// A single preopened directory grant (guest view only; the host path is not
// attested).
message Preopen {
  string guest_path = 1;
  DirPerms dir_perms = 2;
  FilePerms file_perms = 3;
}

enum StdioGrant {
  STDIO_GRANT_UNSPECIFIED = 0;
  STDIO_GRANT_CLOSED = 1;   // reads EOF / writes rejected
  STDIO_GRANT_SINK = 2;     // writes accepted and discarded
  STDIO_GRANT_INHERIT = 3;  // wired to the host process's stdio
  STDIO_GRANT_PIPE = 4;     // wired to an in-memory pipe
}

enum RandomGrant {
  RANDOM_GRANT_UNSPECIFIED = 0;
  RANDOM_GRANT_NONE = 1;           // wasi:random not backed
  RANDOM_GRANT_SECURE = 2;         // real CSPRNG
  RANDOM_GRANT_DETERMINISTIC = 3;  // fixed/seeded (test only)
}

enum DirPerms {
  DIR_PERMS_UNSPECIFIED = 0;
  DIR_PERMS_NONE = 1;
  DIR_PERMS_READ = 2;
  DIR_PERMS_MUTATE = 3;  // read + create/delete/rename within the dir
}

enum FilePerms {
  FILE_PERMS_UNSPECIFIED = 0;
  FILE_PERMS_NONE = 1;
  FILE_PERMS_READ = 2;
  FILE_PERMS_WRITE = 3;  // read + write
}

// Identifies the runtime that produced (and will enforce) this claim.
message WasmRuntimeInfo {
  string engine = 1;          // "wasmtime"
  string engine_version = 2;  // e.g. "25.0.3"
  string wasi_version = 3;    // "0.2.x"
  bool component_model = 4;    // must be true
  bool dynamic_loading = 5;    // must be false
}

// One component instance in the composition.
message ComponentClaim {
  string id = 1;    // logical name from the manifest
  string role = 2;  // "public_input_adapter" | "private_computation"
                    // | "output_filter" | ...
  bytes digest = 3;  // SHA-256 of the component binary
  // If true, `digest` is omitted here and appears only inside the
  // application_commitment preimage (the binary identity stays private).
  bool confidential = 4;
}

// A single WASI capability granted to a component instance. Denials are
// represented by absence from this list plus the RuntimeProperties tri-state;
// there is intentionally no "denied capability" entry.
message GrantedWasiCapability {
  string interface = 1;          // e.g. "wasi:filesystem/types@0.2.0"
  string component_id = 2;       // which instance received it
  repeated string operations = 3;
  repeated string resources = 4;  // logical handles: "input://client-dataset"

  enum Provenance {
    PROVENANCE_UNSPECIFIED = 0;
    HOST_PROVIDED = 1;  // linked directly by the orchestrator
    MEDIATED = 2;       // provided by another component (e.g. a filter)
  }
  Provenance provenance = 5;
}

// Coarse-grained ambient-authority properties of the whole composition.
//
// Tri-state on purpose: UNKNOWN (absent) is rejected by the KMS whenever the
// policy requires DENIED. Absence is never silently treated as denial.
message RuntimeProperties {
  enum Enforcement {
    UNKNOWN = 0;
    DENIED = 1;
    GRANTED = 2;
  }
  Enforcement network = 1;
  Enforcement persistent_storage = 2;
  Enforcement wall_clock = 3;
  Enforcement randomness = 4;
  Enforcement environment = 5;
  Enforcement spawn = 6;
}

// The resolved, canonicalized wiring of the composition.
//
// Host-mediated wiring (not `wac` fusion): the orchestrator instantiates each
// component separately and wires exports to imports itself, so per-component
// boundaries and capability attribution are preserved and mediation is
// provable. Distinguished endpoints model the external input/output the host
// provides.
message CompositionGraph {
  // Logical component ids of the graph nodes, sorted byte-wise for
  // canonicalization. Details of each node are in the `components` list.
  repeated string nodes = 1;

  message Edge {
    string from = 1;       // producer component id, or "" for external_input
    string to = 2;         // consumer component id, or "" for external_output
    string interface = 3;  // fully-qualified "ns:pkg/iface@version"
  }
  // Edges sorted by (from, to, interface) for canonicalization.
  repeated Edge edges = 2;
}

// The relying party's policy over a `WasmCapabilityClaim`.
//
// This is the CFC KMS's authorization predicate for capability-gated key
// release: instead of pinning an exact binary measurement, the KMS releases
// keys to any confidential wasm workload whose attested claim satisfies this
// matcher. It is carried in the access policy's `Transform.config_constraints`
// (an existing `google.protobuf.Any`), so no federated-compute schema change is
// required. The KMS decodes it during `match_transform` and fails closed on any
// unmet constraint or on an absent/unknown claim.
//
// Deliberately does NOT match component `digest`s: pinning binary identity is
// exactly the measurement model this replaces. The composition may be
// confidential/undisclosed and is authorized by *what it can do* (its structure
// and capabilities), not *which bytes it is*.
//
// Every field is "don't care" when left at its default, so an empty matcher
// accepts any well-formed claim. All constraints are ANDed together.
message WasmCapabilityMatcher {
  // If non-empty, the claim's `schema_version` must equal this exactly.
  string schema_version = 1;

  // Per-property required enforcement over the claim's coarse
  // `runtime_properties` projection. For each property set to DENIED or GRANTED
  // here, the claim's corresponding property must match exactly; UNKNOWN (the
  // default) means "don't care". Because the claim's tri-state treats UNKNOWN as
  // "not proven", a required DENIED is only satisfied by a claim that positively
  // proves DENIED, never by an absent/unknown value.
  RuntimeProperties required_runtime_properties = 2;

  // If true, the claim's `runtime_info.component_model` must be true.
  bool require_component_model = 3;

  // If true, the claim's `runtime_info.dynamic_loading` must be false.
  bool forbid_dynamic_loading = 4;

  // Fine-grained global interface denylist. Release is denied if ANY granted
  // capability in the claim (held by any component) has an `interface` matching
  // one of these patterns. This enforces per-interface denial the coarse
  // `runtime_properties` projection cannot express. A pattern matches by exact
  // string equality, or as a prefix when it ends with '*'
  // (e.g. "wasi:sockets/*", "wasi:filesystem/*").
  repeated string forbidden_interfaces = 5;

  // Each role listed here must be held by at least one component in the claim
  // (matched against `ComponentClaim.role`). Proves structural presence — e.g.
  // that a mediating "output_filter" exists — without pinning binary identity.
  // Empty => no structural role requirement.
  repeated string required_component_roles = 6;

  // Graph topology that MUST be present: each matcher must match at least one
  // edge in the claim's `graph.edges`. Lets the policy require a specific wiring
  // (e.g. the private component's output flows into the filter).
  repeated EdgeMatcher required_edges = 7;

  // Graph topology that MUST NOT be present: no edge in the claim's
  // `graph.edges` may match any of these matchers. Bypass prevention — e.g.
  // forbid any edge from the private component directly to external output.
  repeated EdgeMatcher forbidden_edges = 8;

  // Per-component capability constraints, keyed by component id.
  repeated ComponentCapabilityRule component_rules = 9;
}

// A pattern over a `CompositionGraph.Edge`. Endpoints default to a wildcard;
// the interface pattern defaults to "any". An edge matches only if all three
// (from, to, interface) match.
message EdgeMatcher {
  EdgeEndpointMatcher from = 1;
  EdgeEndpointMatcher to = 2;
  // Interface pattern (exact, or trailing '*' prefix). Empty => any interface.
  string interface = 3;
}

// Constrains one endpoint of an edge. Recall the claim models the external
// input/output endpoints as the empty string "" in `Edge.from` / `Edge.to`.
message EdgeEndpointMatcher {
  enum Kind {
    // Wildcard: matches any endpoint (the default).
    ANY = 0;
    // Matches only the external input/output endpoint (claim field == "").
    EXTERNAL = 1;
    // Matches only the component whose id equals `component_id` below.
    COMPONENT = 2;
  }
  Kind kind = 1;
  // The component id to match; used only when `kind == COMPONENT`.
  string component_id = 2;
}

// Constrains the granted capabilities attributed to a single component. Applies
// to every `GrantedWasiCapability` whose `component_id` equals `component_id`.
// A component absent from the claim trivially satisfies every rule here (use
// `required_component_roles` to force presence).
message ComponentCapabilityRule {
  // Which component this rule applies to (matches `ComponentClaim.id` /
  // `GrantedWasiCapability.component_id`).
  string component_id = 1;

  // Allowlist: if non-empty, EVERY capability held by this component must have
  // an `interface` matching one of these patterns (same '*' prefix semantics as
  // `forbidden_interfaces`). Any capability outside the allowlist denies release.
  repeated string allowed_interfaces = 2;

  // Denylist: this component must hold NO capability whose `interface` matches
  // one of these patterns.
  repeated string forbidden_interfaces = 3;

  // If true, this component must hold no granted capabilities at all.
  bool forbid_all_capabilities = 4;
}