# Overlay drop-in, added to the system image by Bazel (see
# //oak_containers/system_image:BUILD). Sorts after `override.conf`, so these keys
# win. Purpose: keep the volatile journal from rotating (and discarding entries)
# mid-run, so orchestrator INFO logs -- e.g. the [timing] lines emitted during the
# multi-second wasm compile -- are not dropped before oak_containers_syslogd exports
# them to the console. See docs/orchestrator-log-drops-journald.md.
[Journal]
RateLimitIntervalSec=0
RuntimeMaxUse=64M
RuntimeMaxFileSize=16M
